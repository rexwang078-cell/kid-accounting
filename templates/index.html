<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>親子記帳系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style> body { background-color: #f8f9fa; } .app-container { max-width: 500px; margin: 0 auto; padding: 20px; } </style>
</head>
<body>
    <div class="app-container">
        <!-- 萬用錯誤警告區塊 -->
        <div id="errorBanner" class="alert alert-danger" style="display: none; font-weight: bold;"></div>

        <div id="authSection" class="text-center py-5">
            <div class="spinner-border text-primary mb-3" role="status" id="loadingSpinner"></div>
            <h4 id="authMessage" class="text-secondary">正在登入中...</h4>
            
            <div id="bindSection" style="display:none;" class="mt-4 text-start card shadow-sm p-4">
                <h5 class="text-primary mb-3">👋 歡迎首次登入</h5>
                <div id="bindButtons" class="d-grid gap-3"></div>
            </div>
        </div>

        <div id="mainApp" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="m-0">📝 記帳本</h3>
                <div>
                    <span id="loggedInName" class="badge bg-primary fs-6 py-2 px-3 me-1"></span>
                    <button class="btn btn-sm btn-outline-danger" onclick="unbindMe()">登出測試</button>
                </div>
            </div>

            <div id="childViewSwitcher" class="mb-3" style="display: none;">
                <select id="viewingChild" class="form-select border-info text-info fw-bold bg-info bg-opacity-10"></select>
            </div>

            <div id="childDashboard" style="display: none;">
                <div class="card shadow-sm mb-3 border-info">
                    <div class="card-body p-3 text-center">
                        <h5 class="mb-2" id="childNameTitle"></h5>
                        <div class="row">
                            <div class="col-6 border-end">
                                <small class="text-muted">手邊個人餘額</small>
                                <h4 class="mb-0" id="personalBalance">$0</h4>
                            </div>
                            <div class="col-6">
                                <small class="text-muted">寄放家長餘額</small>
                                <h4 class="text-success mb-0" id="depositedBalance">$0</h4>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="card shadow-sm mb-4">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="text-secondary fw-bold m-0">📊 收支統計</h6>
                            <div><button class="btn btn-sm btn-outline-primary" onclick="setStatsDate(7)">近 7 天</button></div>
                        </div>
                        <div class="d-flex gap-2 mb-3">
                            <input type="date" id="statStartDate" class="form-control form-control-sm">
                            <span class="align-self-center">~</span>
                            <input type="date" id="statEndDate" class="form-control form-control-sm">
                            <button class="btn btn-sm btn-primary" onclick="loadStats()">查詢</button>
                        </div>
                        <div class="row text-center mb-2">
                            <div class="col-6"><small class="text-muted">期間獲得</small><h6 class="text-primary mb-0" id="statIn">$0</h6></div>
                            <div class="col-6"><small class="text-muted">期間花費</small><h6 class="text-danger mb-0" id="statOut">$0</h6></div>
                        </div>
                        <canvas id="statsChart" width="100%" height="60"></canvas>
                    </div>
                </div>
            </div>

            <div id="parentDashboard" class="card shadow-sm mb-4 border-primary" style="display: none; background-color: #eef2ff;">
                <div class="card-body">
                    <h5 class="card-title text-primary text-center mb-3">🛡️ 兒童帳戶總覽</h5>
                    <div class="row text-center" id="kidsBalances"></div>
                </div>
            </div>
            
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <form id="recordForm">
                        <div class="mb-3" id="targetChildDiv" style="display: none;">
                            <label class="form-label text-muted">發放對象</label>
                            <select class="form-select" id="targetChild"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted">動作</label>
                            <select class="form-select" id="typeChild">
                                <option value="expense">支出 (扣個人餘額，不需確認)</option>
                                <option value="deposit">把手邊的錢存入寄放 (扣個人餘額，需家長確認)</option>
                                <option value="deposit_income">存入打工收入 (僅增加寄放，不扣手邊，需家長確認)</option>
                            </select>
                            <select class="form-select" id="typeParent" style="display: none;">
                                <option value="allowance">給零用錢 (需小孩確認收下)</option>
                                <option value="withdraw_deposit">領取寄放的錢 (需小孩確認收到)</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label text-muted">金額</label><input type="number" class="form-control form-control-lg" id="recordAmount" placeholder="NT$ 0" required></div>
                        <div class="mb-3"><label class="form-label text-muted">備註 / 項目</label><input type="text" class="form-control" id="recordNote" placeholder="例如：買文具、發壓歲錢"></div>
                        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100">確認送出</button>
                    </form>
                </div>
            </div>
            
            <div id="pendingSection" class="mb-4" style="display: none;">
                <h5 class="text-warning m-0 mb-2">🔔 待確認任務</h5>
                <ul class="list-group" id="pendingList"></ul>
            </div>

            <!-- ★★★ 新增：歷史歸檔紀錄區塊 ★★★ -->
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="text-secondary m-0">📁 歷史歸檔紀錄</h5>
                </div>
                
                <!-- 家長專屬：產生歸檔工具 -->
                <div id="archiveControlParent" class="card shadow-sm mb-3 border-secondary" style="display: none; background-color: #fcfcfc;">
                    <div class="card-body p-3">
                        <h6 class="text-primary mb-3">📝 新增結算歸檔 (家長專用)</h6>
                        <div class="mb-2">
                            <label class="form-label text-muted small m-0">歸檔對象</label>
                            <select class="form-select form-select-sm" id="archiveTargetChild"></select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-muted small m-0">結算區間</label>
                            <div class="d-flex gap-2">
                                <input type="date" id="archiveStartDate" class="form-control form-control-sm">
                                <span class="align-self-center text-muted">~</span>
                                <input type="date" id="archiveEndDate" class="form-control form-control-sm">
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label text-muted small m-0">歸檔名稱</label>
                            <div class="input-group input-group-sm">
                                <input type="text" id="archiveTitle" class="form-control" placeholder="例：大寶 10月份結算">
                                <button class="btn btn-primary" onclick="createArchive(event)">產生歸檔</button>
                            </div>
                        </div>
                        <small class="text-muted" style="font-size: 0.75rem;">系統會自動加總設定區間內的花費與獲得，並存成一筆固定紀錄供日後查詢。</small>
                    </div>
                </div>
                <!-- 歸檔列表顯示區 -->
                <ul class="list-group" id="archiveList"></ul>
            </div>

            <div class="mb-5">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 class="text-secondary m-0">📋 近期紀錄</h5>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="setListDate(7)">近 7 天</button>
                        <button class="btn btn-sm btn-outline-secondary" onclick="setListDate(30)">近 30 天</button>
                    </div>
                </div>
                <div class="d-flex gap-2 mb-3">
                    <input type="date" id="listStartDate" class="form-control form-control-sm">
                    <input type="date" id="listEndDate" class="form-control form-control-sm">
                    <button class="btn btn-sm btn-secondary" onclick="loadList(true)">篩選</button>
                </div>
                <ul class="list-group" id="transactionList"></ul>
                <div class="text-center mt-3"><button id="loadMoreBtn" class="btn btn-outline-secondary btn-sm" style="display: none;">⬇️ 載入更多</button></div>
            </div>
        </div>
    </div>

    <script>
        const MY_LIFF_ID = "2012416943-AdWqCrGD"; 
        let loggedInUser = null, isParent = false, currentLoadedCount = 0, chartInstance = null, allKids = [], lineProfile = null;

        function showAppError(msg) {
            const eb = document.getElementById('errorBanner');
            eb.style.display = 'block';
            eb.innerText = "系統錯誤: " + msg;
        }

        async function initApp() {
            try {
                await liff.init({ liffId: MY_LIFF_ID });
                if (!liff.isLoggedIn()) { 
                    liff.login(); 
                    return; 
                }
                lineProfile = await liff.getProfile();
                checkAuth();
            } catch (err) { 
                const errMsg = err.message || "";
                
                // ★ 自動處理 Token 失效的防呆機制 ★
                if (errMsg.includes("access token revoked") || errMsg.includes("expired")) {
                    // 1. 隱藏原本的錯誤橫幅，改在載入畫面顯示提示
                    document.getElementById('errorBanner').style.display = 'none';
                    const authMsg = document.getElementById('authMessage');
                    if (authMsg) {
                        authMsg.style.display = 'block';
                        authMsg.className = 'text-warning mt-3';
                        authMsg.innerText = "⏳ 登入憑證已過期，系統自動為您重新連線中...";
                    }
                    
                    // 2. 清除瀏覽器內無效的快取 Token
                    try { liff.logout(); } catch(e) {}
                    
                    // 3. 稍等 1.5 秒後自動重整網頁，觸發全新的登入授權
                    setTimeout(() => {
                        window.location.reload();
                    }, 1500);
                } else {
                    // 若是其他未知錯誤，則照常顯示紅色的錯誤警告
                    showAppError("LINE 初始化失敗：" + errMsg); 
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initApp();

            document.getElementById('recordForm').addEventListener('submit', async (e) => {
                e.preventDefault(); 
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = true;
                submitBtn.innerText = "⏳ 處理中...";

                try {
                    const tId = isParent ? document.getElementById('targetChild').value : loggedInUser.id;
                    const type = isParent ? document.getElementById('typeParent').value : document.getElementById('typeChild').value;
                    const amount = parseFloat(document.getElementById('recordAmount').value);
                    const note = document.getElementById('recordNote').value;

                    if (!amount || amount <= 0) {
                        alert("請輸入大於 0 的金額");
                        return;
                    }

                    const res = await fetch('/api/transaction/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            user_id: parseInt(tId),
                            actor_id: loggedInUser.id,
                            type: type,
                            amount: amount,
                            note: note
                        })
                    });
                    
                    const data = await res.json();
                    if (data.status === 'success') {
                        alert(data.message); 
                        document.getElementById('recordAmount').value = '';
                        document.getElementById('recordNote').value = '';
                        setupApp(); 
                    } else {
                        alert("錯誤：" + data.message);
                    }
                } catch(err) {
                    alert("連線發生錯誤：" + err.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "確認送出";
                }
            });
        });

        async function checkAuth() {
            try {
                const res = await fetch(`/api/auth/${lineProfile.userId}`);
                if(!res.ok) throw new Error("Auth API 連線失敗");
                const data = await res.json();
                if (data.status === 'unbound') {
                    document.getElementById('loadingSpinner').style.display = 'none';
                    document.getElementById('authMessage').style.display = 'none';
                    document.getElementById('bindSection').style.display = 'block';
                    loadUnboundUsers();
                } else {
                    loggedInUser = data; isParent = (loggedInUser.role === 'parent');
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                    document.getElementById('loggedInName').innerText = `👤 ${loggedInUser.name}`;
                    setupApp();
                }
            } catch(e) { showAppError("驗證失敗: " + e.message); }
        }

        async function loadUnboundUsers() {
            try {
                const res = await fetch('/api/unbound_users/');
                const users = await res.json();
                document.getElementById('bindButtons').innerHTML = users.map(u => `<button class="btn btn-outline-primary btn-lg" onclick="bindUser(${u.id})">我是 ${u.name}</button>`).join('');
                if(users.length === 0) document.getElementById('bindButtons').innerHTML = '<div class="alert alert-warning">無可用帳號。</div>';
            } catch(e) { showAppError("讀取未綁定名單失敗"); }
        }

        async function bindUser(userId) {
            const res = await fetch('/api/bind/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ line_id: lineProfile.userId, user_id: userId }) });
            if ((await res.json()).status === 'success') checkAuth(); else alert("綁定失敗");
        }

        async function unbindMe() {
            if(confirm('確定要登出並重選身分嗎？')) {
                await fetch(`/api/unbind/${loggedInUser.id}`);
                if (liff.isLoggedIn()) liff.logout();
                location.reload();
            }
        }

        async function setupApp() {
            try {
                const allRes = await fetch('/api/users/');
                if(!allRes.ok) throw new Error("API /api/users/ 發生錯誤");
                allKids = (await allRes.json()).filter(u => u.role === 'child');
                
                document.getElementById('parentDashboard').style.display = isParent ? 'block' : 'none';
                document.getElementById('targetChildDiv').style.display = isParent ? 'block' : 'none';
                document.getElementById('typeParent').style.display = isParent ? 'block' : 'none';
                document.getElementById('typeChild').style.display = isParent ? 'none' : 'block';
                
                if (isParent) {
                    const childOptions = allKids.map(k => `<option value="${k.id}">👦 ${k.name}</option>`).join('');
                    document.getElementById('targetChild').innerHTML = childOptions;
                    
                    // 💡 給家長的歸檔工具選項與預設日期
                    document.getElementById('archiveTargetChild').innerHTML = childOptions;
                    document.getElementById('archiveControlParent').style.display = 'block';
                    const end = new Date(), start = new Date(); start.setDate(1); 
                    document.getElementById('archiveStartDate').value = formatDate(start); 
                    document.getElementById('archiveEndDate').value = formatDate(end);
                    
                    document.getElementById('kidsBalances').innerHTML = allKids.map(k => `
                        <div class="col-6 border-end pb-2"><h6 class="text-secondary mb-1">${k.name}</h6>
                        <div class="${k.personal_balance < 0 ? 'text-danger fw-bold' : 'text-dark'}">手邊: $${k.personal_balance}</div>
                        <div class="text-success fw-bold">寄放: $${k.deposited_balance}</div>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="editBalance(${k.id}, '${k.name}', ${k.personal_balance}, ${k.deposited_balance})">⚙️ 設定</button></div>`).join('');
                    if(!document.getElementById('listStartDate').value) setListDate(7, false);
                    loadList(true);
                    loadPending();
                    loadArchives(); // 家長載入全部歸檔
                } else {
                    document.getElementById('childDashboard').style.display = 'block';
                    document.getElementById('childViewSwitcher').style.display = 'block';
                    const switcher = document.getElementById('viewingChild');
                    switcher.innerHTML = allKids.map(k => `<option value="${k.id}" ${k.id === loggedInUser.id ? 'selected' : ''}>${k.id === loggedInUser.id ? '📍 我的帳本' : '👀 查看 '+k.name+' 的帳本'}</option>`).join('');
                    switcher.addEventListener('change', refreshChildView);
                    refreshChildView();
                }
            } catch (e) { showAppError("介面初始化失敗: " + e.message); }
        }

        function refreshChildView() {
            try {
                const targetId = parseInt(document.getElementById('viewingChild').value);
                const targetUser = allKids.find(k => k.id === targetId);
                if(!targetUser) return;
                
                const isMe = (targetId === loggedInUser.id);
                document.getElementById('childNameTitle').innerText = `👤 ${targetUser.name}`;
                document.getElementById('personalBalance').innerText = `$${targetUser.personal_balance}`;
                document.getElementById('depositedBalance').innerText = `$${targetUser.deposited_balance}`;
                document.getElementById('recordAmount').disabled = !isMe;
                document.getElementById('recordNote').disabled = !isMe;
                document.getElementById('typeChild').disabled = !isMe;
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = !isMe; submitBtn.innerText = isMe ? '確認送出' : '🚫 僅供查看';
                
                if(!document.getElementById('statStartDate').value) setStatsDate(7, true); else loadStats();
                if(!document.getElementById('listStartDate').value) setListDate(7, false);
                loadList(true);
                loadPending();
                loadArchives(); // 切換小孩時載入該位小孩的歸檔
            } catch (e) { showAppError("切換身分時發生錯誤: " + e.message); }
        }

        // 💡 新增：產生結算歸檔的函式
        async function createArchive(event) {
            const tId = document.getElementById('archiveTargetChild').value;
            const sDate = document.getElementById('archiveStartDate').value;
            const eDate = document.getElementById('archiveEndDate').value;
            const title = document.getElementById('archiveTitle').value;

            if(!tId || !sDate || !eDate || !title) {
                alert("請填寫完整歸檔資訊！"); return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.innerText = "處理中...";

            try {
                const res = await fetch('/api/archive/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(tId), actor_id: loggedInUser.id, title: title, start_date: sDate, end_date: eDate })
                });
                const data = await res.json();
                if(data.status === 'success') {
                    alert("歸檔成功！");
                    document.getElementById('archiveTitle').value = "";
                    loadArchives(); // 重新讀取清單
                } else {
                    alert(data.message);
                }
            } catch(e) { alert("連線錯誤: "+e.message); }
            finally { btn.disabled = false; btn.innerText = "產生歸檔"; }
        }

        // 💡 新增：讀取歸檔清單的函式
        async function loadArchives() {
            try {
                const listUid = isParent ? 0 : document.getElementById('viewingChild').value;
                const res = await fetch(`/api/archives/?user_id=${listUid}`);
                const archives = await res.json();
                const listElement = document.getElementById('archiveList');
                if(archives.length === 0) {
                    listElement.innerHTML = '<li class="list-group-item text-center text-muted">無歸檔紀錄</li>';
                    return;
                }
                listElement.innerHTML = archives.map(a => {
                    const nameBadge = isParent ? `<span class="badge bg-info text-dark me-2">👤 ${a.user_name}</span>` : '';
                    return `<li class="list-group-item bg-light">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <div class="fw-bold text-dark fs-6">${nameBadge}${a.title}</div>
                            <span class="badge bg-secondary">結算於: ${a.timestamp}</span>
                        </div>
                        <div class="row text-center bg-white p-2 rounded shadow-sm">
                            <div class="col-6 border-end"><small class="text-muted">期間總獲得</small><br><span class="text-primary fw-bold">$${a.total_income}</span></div>
                            <div class="col-6"><small class="text-muted">期間總花費</small><br><span class="text-danger fw-bold">$${a.total_expense}</span></div>
                        </div>
                    </li>`;
                }).join('');
            } catch(e) { console.error("Archive load error", e); }
        }

        async function loadPending() {
            try {
                const targetId = isParent ? loggedInUser.id : document.getElementById('viewingChild').value;
                if(!isParent && targetId != loggedInUser.id) {
                    document.getElementById('pendingSection').style.display = 'none'; return;
                }
                const res = await fetch(`/api/pending/${loggedInUser.id}`);
                const pending = await res.json();
                const box = document.getElementById('pendingSection');
                const list = document.getElementById('pendingList');
                if(pending.length > 0) {
                    box.style.display = 'block';
                    list.innerHTML = pending.map(p => {
                        const tMap = { 'deposit': '存入手邊餘額至寄放', 'deposit_income': '存入打工收入', 'allowance': '家長發零用錢', 'withdraw_deposit': '提領寄放' };
                        return `<li class="list-group-item"><div class="fw-bold mb-1">${p.user_name} - ${tMap[p.type]} $${p.amount}</div><div class="d-flex justify-content-between align-items-center"><div class="text-muted small">${p.note || '無備註'}</div><div><button class="btn btn-sm btn-success me-1" onclick="confirmTx(${p.id}, 'approve')">✅ 收到</button><button class="btn btn-sm btn-danger" onclick="confirmTx(${p.id}, 'reject')">❌ 拒絕</button></div></div></li>`;
                    }).join('');
                } else { box.style.display = 'none'; }
            } catch (e) { console.error("Pending load error", e); }
        }

        async function confirmTx(id, action) {
            await fetch(`/api/confirm/${id}?action=${action}`, { method: 'POST' });
            setupApp(); 
        }

        async function editBalance(childId, childName, currentP, currentD) {
            const newP = prompt(`設定【${childName}】新手邊餘額：`, currentP); if (newP === null) return;
            const newD = prompt(`設定【${childName}】新寄放餘額：`, currentD); if (newD === null) return;
            const res = await fetch(`/api/user/${childId}/balance?actor_id=${loggedInUser.id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ personal_balance: parseFloat(newP), deposited_balance: parseFloat(newD) }) });
            if ((await res.json()).status === 'success') setupApp();
        }

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            return [year, month.length < 2 ? '0'+month : month, day.length < 2 ? '0'+day : day].join('-');
        }
        function setStatsDate(days, fetch=true) {
            const end = new Date(), start = new Date(); start.setDate(start.getDate() - days + 1);
            document.getElementById('statStartDate').value = formatDate(start); document.getElementById('statEndDate').value = formatDate(end);
            if(fetch) loadStats();
        }
        function setListDate(days, fetch=true) {
            const end = new Date(), start = new Date(); start.setDate(start.getDate() - days + 1);
            document.getElementById('listStartDate').value = formatDate(start); document.getElementById('listEndDate').value = formatDate(end);
            if(fetch) loadList(true);
        }

        async function loadStats() {
            if(isParent) return; 
            try {
                const targetId = parseInt(document.getElementById('viewingChild').value);
                const start = document.getElementById('statStartDate').value, end = document.getElementById('statEndDate').value;
                const res = await fetch(`/api/stats/?user_id=${targetId}&start_date=${start}&end_date=${end}`);
                const stats = await res.json();
                document.getElementById('statIn').innerText = `$${stats.total_allowance || 0}`; document.getElementById('statOut').innerText = `$${stats.total_expense || 0}`;
                const ctx = document.getElementById('statsChart').getContext('2d');
                let labels = [], incomeData = [], expenseData = [], curr = new Date(start);
                while(curr <= new Date(end)) {
                    const dStr = formatDate(curr); labels.push(dStr.substring(5)); 
                    let dailyIn = (stats.daily[dStr] ? stats.daily[dStr].income : 0);
                    incomeData.push(dailyIn); 
                    expenseData.push(stats.daily[dStr] ? stats.daily[dStr].expense : 0);
                    curr.setDate(curr.getDate() + 1);
                }
                if(chartInstance) chartInstance.destroy(); 
                chartInstance = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ label: '獲得', data: incomeData, backgroundColor: '#36A2EB' }, { label: '花費', data: expenseData, backgroundColor: '#FF6384' }] }, options: { responsive: true, scales: { y: { beginAtZero: true } } } });
            } catch (e) { console.error("Stats Error", e); }
        }

        async function loadList(reset = true) {
            try {
                const listUid = isParent ? 0 : document.getElementById('viewingChild').value;
                const start = document.getElementById('listStartDate').value, end = document.getElementById('listEndDate').value;
                let url = `/api/transactions/?user_id=${listUid}&skip=${reset ? 0 : currentLoadedCount}`;
                if(start) url += `&start_date=${start}`; if(end) url += `&end_date=${end}`;
                const res = await fetch(url);
                const records = await res.json();
                
                const listElement = document.getElementById('transactionList');
                if(reset) { listElement.innerHTML = ''; currentLoadedCount = 0; }
                if(reset && records.length === 0) { listElement.innerHTML = '<li class="list-group-item text-center text-muted">無紀錄</li>'; return; }
                
                const typeMap = { 
                    'expense': { l: '支出', b: 'bg-danger', s: '-' }, 
                    'deposit': { l: '手邊存入寄放', b: 'bg-success', s: '+' }, 
                    'deposit_income': { l: '打工存入寄放', b: 'bg-success', s: '+' },
                    'allowance': { l: '獲零用錢', b: 'bg-primary', s: '+' }, 
                    'withdraw_deposit': { l: '提領寄放', b: 'bg-warning text-dark', s: '+' }, 
                    'adjustment': { l: '系統校正', b: 'bg-secondary', s: '' } 
                };
                records.forEach(r => {
                    const t = typeMap[r.type];
                    let timeStr = "";
                    if(r.timestamp) { const d = new Date(r.timestamp); timeStr = d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }); }
                    const nameBadge = isParent ? `<span class="badge bg-info text-dark me-2">👤 ${r.user_name}</span>` : '';
                    const statusBadge = r.status === 'pending' ? '<span class="badge bg-warning text-dark me-1">待確認</span>' : (r.status === 'rejected' ? '<span class="badge bg-secondary me-1">已拒絕</span>' : '');
                    listElement.innerHTML += `<li class="list-group-item d-flex justify-content-between align-items-center"><div class="ms-2 me-auto"><div class="fw-bold mb-1">${statusBadge}${nameBadge}<span class="badge ${t.b}">${t.l}</span> ${r.note || ''}</div><div class="text-muted" style="font-size: 0.85em;">🕒 ${timeStr}</div></div><span class="fs-5 fw-semibold ${r.type==='expense'?'text-danger':'text-success'}">${r.type==='adjustment'?'':t.s+' $'+r.amount}</span></li>`;
                });
                currentLoadedCount += records.length;
                document.getElementById('loadMoreBtn').style.display = records.length === 20 ? 'inline-block' : 'none';
            } catch (e) { showAppError("讀取紀錄失敗: " + e.message); }
        }
    </script>
</body>
</html>
