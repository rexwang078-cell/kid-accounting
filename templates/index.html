<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>親子記帳系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style> body { background-color: #f8f9fa; } .app-container { max-width: 500px; margin: 0 auto; padding: 20px; } </style>
</head>
<body>
    <div class="app-container">
        <!-- 標題與切換身分 -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="m-0">📝 記帳本</h3>
            <select id="currentUser" class="form-select w-auto fw-bold text-primary">
                <option value="1">👨 爸爸</option>
                <option value="2">👩 媽媽</option>
                <option value="3" selected>👦 大寶</option>
                <option value="4">👧 二寶</option>
            </select>
        </div>

        <!-- 小孩專屬：狀態與統計 -->
        <div id="childDashboard" style="display: block;">
            <div class="card shadow-sm mb-3 border-info">
                <div class="card-body p-3 text-center">
                    <h5 class="mb-2" id="childNameTitle">載入中...</h5>
                    <div class="row">
                        <div class="col-6 border-end">
                            <small class="text-muted">手邊個人餘額</small>
                            <h4 class="mb-0" id="personalBalance">$0</h4>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">寄放家長餘額</small>
                            <h4 class="text-success mb-0" id="depositedBalance">$0</h4>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6 class="text-secondary fw-bold m-0">📊 收支統計</h6>
                        <div>
                            <button class="btn btn-sm btn-outline-primary" onclick="setStatsDate(7)">近 7 天</button>
                            <button class="btn btn-sm btn-outline-primary" onclick="setStatsDate(30)">近 30 天</button>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mb-3">
                        <input type="date" id="statStartDate" class="form-control form-control-sm">
                        <span class="align-self-center">~</span>
                        <input type="date" id="statEndDate" class="form-control form-control-sm">
                        <button class="btn btn-sm btn-primary" onclick="loadStats()">查詢</button>
                    </div>
                    
                    <div class="row text-center mb-2">
                        <div class="col-6"><small class="text-muted">期間獲得</small><h6 class="text-primary mb-0" id="statIn">$0</h6></div>
                        <div class="col-6"><small class="text-muted">期間花費</small><h6 class="text-danger mb-0" id="statOut">$0</h6></div>
                    </div>
                    <canvas id="statsChart" width="100%" height="60"></canvas>
                </div>
            </div>
        </div>

        <!-- 家長專屬：代管總覽 -->
        <div id="parentDashboard" class="card shadow-sm mb-4 border-primary" style="display: none; background-color: #eef2ff;">
            <div class="card-body">
                <h5 class="card-title text-primary text-center mb-3">🛡️ 兒童帳戶總覽</h5>
                <div class="row text-center" id="kidsBalances"></div>
                
                <!-- ★ 新增：下載資料庫按鈕 -->
                <div class="text-center mt-3 pt-3 border-top border-primary-subtle">
                    <button class="btn btn-sm btn-outline-primary" onclick="downloadDB()">💾 下載資料庫備份 (.db)</button>
                    <div class="form-text mt-1">※ 下載後可使用 DB Browser for SQLite 軟體開啟查看或備份</div>
                </div>
            </div>
        </div>
        
        <!-- 表單區塊 -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="recordForm">
                    <div class="mb-3" id="targetChildDiv" style="display: none;">
                        <label class="form-label text-muted">發放對象</label>
                        <select class="form-select" id="targetChild">
                            <option value="3">👦 大寶</option>
                            <option value="4">👧 二寶</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted">動作</label>
                        <select class="form-select" id="typeChild">
                            <option value="expense">支出 (扣個人餘額)</option>
                            <option value="deposit">存入 (增加寄放餘額)</option>
                        </select>
                        <select class="form-select" id="typeParent" style="display: none;">
                            <option value="allowance">給零用錢 (加個人餘額)</option>
                            <option value="withdraw_deposit">領取寄放的錢 (扣寄放，加個人)</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted">金額</label>
                        <input type="number" class="form-control form-control-lg" id="recordAmount" placeholder="NT$ 0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted">備註 / 項目</label>
                        <input type="text" class="form-control" id="recordNote" placeholder="例如：買文具、發壓歲錢">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">確認送出</button>
                </form>
            </div>
        </div>
        
        <!-- 流水帳與日期篩選 -->
        <div class="mb-5">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 class="text-secondary m-0">📋 近期紀錄</h5>
                <div>
                    <button class="btn btn-sm btn-outline-secondary" onclick="setListDate(7)">近 7 天</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="setListDate(30)">近 30 天</button>
                </div>
            </div>
            <div class="d-flex gap-2 mb-3">
                <input type="date" id="listStartDate" class="form-control form-control-sm">
                <input type="date" id="listEndDate" class="form-control form-control-sm">
                <button class="btn btn-sm btn-secondary" onclick="loadList(true)">篩選</button>
            </div>
            
            <ul class="list-group" id="transactionList">
                <li class="list-group-item text-center text-muted">載入中...</li>
            </ul>
            <div class="text-center mt-3">
                <button id="loadMoreBtn" class="btn btn-outline-secondary btn-sm" style="display: none;">⬇️ 載入更多舊紀錄</button>
            </div>
        </div>
    </div>

    <script>
        const currentUserId = () => document.getElementById('currentUser').value;
        let isParent = false;
        let currentLoadedCount = 0;
        let chartInstance = null; 

        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        }

        function setStatsDate(days) {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - days + 1); 
            document.getElementById('statStartDate').value = formatDate(start);
            document.getElementById('statEndDate').value = formatDate(end);
            loadStats();
        }

        function setListDate(days, fetchList = true) {
            const end = new Date();
            const start = new Date();
            start.setDate(start.getDate() - days + 1); 
            document.getElementById('listStartDate').value = formatDate(start);
            document.getElementById('listEndDate').value = formatDate(end);
            if(fetchList) loadList(true);
        }

        // ★ 新增：家長修改小孩餘額
        async function editBalance(childId, childName, currentP, currentD) {
            const newP = prompt(`請設定【${childName}】的 📝 新手邊餘額：`, currentP);
            if (newP === null) return;
            const newD = prompt(`請設定【${childName}】的 🏦 新寄放餘額：`, currentD);
            if (newD === null) return;

            const res = await fetch(`/api/user/${childId}/balance?actor_id=${currentUserId()}`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ personal_balance: parseFloat(newP), deposited_balance: parseFloat(newD) })
            });
            const data = await res.json();
            if (data.status === 'success') {
                alert('✅ 餘額設定成功！');
                loadData();
            } else {
                alert(data.message);
            }
        }

        // ★ 新增：下載資料庫
        function downloadDB() {
            window.open(`/api/export_db/?user_id=${currentUserId()}`, '_blank');
        }

        async function loadStats() {
            if(isParent) return; 
            const start = document.getElementById('statStartDate').value;
            const end = document.getElementById('statEndDate').value;
            if(!start || !end) return;

            const res = await fetch(`/api/stats/?user_id=${currentUserId()}&start_date=${start}&end_date=${end}`);
            const stats = await res.json();
            document.getElementById('statIn').innerText = `$${stats.total_allowance}`;
            document.getElementById('statOut').innerText = `$${stats.total_expense}`;
            renderChart(start, end, stats.daily);
        }

        function renderChart(startStr, endStr, dailyData) {
            const ctx = document.getElementById('statsChart').getContext('2d');
            let labels = [], incomeData = [], expenseData = [];
            let curr = new Date(startStr);
            let end = new Date(endStr);
            
            while(curr <= end) {
                const dStr = formatDate(curr);
                labels.push(dStr.substring(5)); 
                incomeData.push(dailyData[dStr] ? dailyData[dStr].income : 0);
                expenseData.push(dailyData[dStr] ? dailyData[dStr].expense : 0);
                curr.setDate(curr.getDate() + 1);
            }

            if(chartInstance) chartInstance.destroy(); 
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '獲得 ($)', data: incomeData, backgroundColor: 'rgba(54, 162, 235, 0.6)', borderWidth: 1 },
                        { label: '花費 ($)', data: expenseData, backgroundColor: 'rgba(255, 99, 132, 0.6)', borderWidth: 1 }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
        }

        function renderTransactions(records, append = false) {
            const listElement = document.getElementById('transactionList');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (!append) { listElement.innerHTML = ''; currentLoadedCount = 0; }
            if (!append && records.length === 0) { 
                listElement.innerHTML = '<li class="list-group-item text-center text-muted">無紀錄</li>'; 
                loadMoreBtn.style.display = 'none'; return; 
            }
            
            const typeMap = {
                'expense': { label: '支出', badge: 'bg-danger', sign: '-' },
                'deposit': { label: '存入寄放', badge: 'bg-success', sign: '+' },
                'allowance': { label: '獲零用錢', badge: 'bg-primary', sign: '+' },
                'withdraw_deposit': { label: '提領寄放', badge: 'bg-warning text-dark', sign: '+' },
                'adjustment': { label: '系統校正', badge: 'bg-secondary', sign: '' } // ★ 新增校正標籤
            };
            
            records.forEach(r => {
                const t = typeMap[r.type];
                const d = new Date(r.timestamp + 'Z');
                const timeStr = d.toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
                const nameBadge = isParent ? `<span class="badge bg-info text-dark me-2">👤 ${r.user_name}</span>` : '';
                const amountText = r.type === 'adjustment' ? '' : `${t.sign} $${r.amount}`;
                
                listElement.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div class="ms-2 me-auto">
                            <div class="fw-bold mb-1">${nameBadge}<span class="badge ${t.badge}">${t.label}</span> ${r.note || ''}</div>
                            <div class="text-muted" style="font-size: 0.85em;">🕒 ${timeStr}</div>
                        </div>
                        <span class="fs-5 fw-semibold ${r.type==='expense'?'text-danger':'text-success'}">${amountText}</span>
                    </li>
                `;
            });

            currentLoadedCount += records.length;
            loadMoreBtn.style.display = records.length === 15 ? 'inline-block' : 'none';
        }

        async function loadList(reset = true) {
            const listUid = isParent ? 0 : currentUserId();
            const start = document.getElementById('listStartDate').value;
            const end = document.getElementById('listEndDate').value;
            let url = `/api/transactions/?user_id=${listUid}&skip=${reset ? 0 : currentLoadedCount}`;
            if(start) url += `&start_date=${start}`;
            if(end) url += `&end_date=${end}`;
            
            const transRes = await fetch(url);
            renderTransactions(await transRes.json(), !reset);
        }

        async function loadData() {
            const uid = currentUserId();
            const userRes = await fetch(`/api/user/${uid}`);
            const user = await userRes.json();
            isParent = (user.role === 'parent');
            
            document.getElementById('parentDashboard').style.display = isParent ? 'block' : 'none';
            document.getElementById('childDashboard').style.display = isParent ? 'none' : 'block';
            document.getElementById('targetChildDiv').style.display = isParent ? 'block' : 'none';
            document.getElementById('typeParent').style.display = isParent ? 'block' : 'none';
            document.getElementById('typeChild').style.display = isParent ? 'none' : 'block';

            if (isParent) {
                const allRes = await fetch('/api/users/');
                const kids = (await allRes.json()).filter(u => u.role === 'child');
                // ★ 更新：加入「設定餘額」的按鈕
                document.getElementById('kidsBalances').innerHTML = kids.map(k => `
                    <div class="col-6 border-end pb-2">
                        <h6 class="text-secondary mb-1">${k.name}</h6>
                        <div class="${k.personal_balance < 0 ? 'text-danger fw-bold' : 'text-dark'}">手邊: $${k.personal_balance}</div>
                        <div class="text-success fw-bold">寄放: $${k.deposited_balance}</div>
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="editBalance(${k.id}, '${k.name}', ${k.personal_balance}, ${k.deposited_balance})">⚙️ 設定餘額</button>
                    </div>
                `).join('');
            } else {
                document.getElementById('childNameTitle').innerText = `👤 ${user.name}`;
                const pb = document.getElementById('personalBalance');
                pb.innerText = `$${user.personal_balance}`;
                pb.className = user.personal_balance < 0 ? 'text-danger mb-0 fw-bold' : 'mb-0 fw-bold';
                document.getElementById('depositedBalance').innerText = `$${user.deposited_balance}`;
                
                if(!document.getElementById('statStartDate').value) setStatsDate(7);
                else loadStats();
            }

            if(!document.getElementById('listStartDate').value) setListDate(7, false);
            loadList(true);
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => loadList(false));
        document.getElementById('currentUser').addEventListener('change', () => {
            document.getElementById('listStartDate').value = '';
            document.getElementById('statStartDate').value = '';
            loadData();
        });
        
        document.getElementById('recordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const target_id = isParent ? document.getElementById('targetChild').value : currentUserId();
            const type = isParent ? document.getElementById('typeParent').value : document.getElementById('typeChild').value;
            
            const res = await fetch('/api/transaction/', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: parseInt(target_id), actor_id: parseInt(currentUserId()),
                    type: type, amount: parseFloat(document.getElementById('recordAmount').value),
                    note: document.getElementById('recordNote').value
                })
            });
            const data = await res.json();
            
            if (data.status === 'error') alert(data.message);
            else { document.getElementById('recordForm').reset(); loadData(); }
        });

        window.onload = () => { loadData(); };
    </script>
</body>
</html>
